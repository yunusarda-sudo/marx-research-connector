name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Offline checks and local server
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Compile
        run: python -m compileall -q .

      # smoke_test.py itself also sends one SendMessage that calls the live,
      # public marx.finance MCP. CI skips that step so it never depends on a
      # third-party service; everything else in the smoke test runs.
      - name: Offline checks and local server (no live Marx call)
        run: python scripts/ci_check.py
